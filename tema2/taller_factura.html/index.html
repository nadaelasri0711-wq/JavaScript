<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de facturación</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor"></div>
    <h1>Sistema de facturación</h1>

    <h2>Añadir productos</h2>
    <div class="formulario">

        <div class="campo">
            <label for="concepto">Concepto:</label>
            <input type="text" id="concepto">
        </div>
        <div class="campo">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" value="1" min="1">
        </div>
        <div class="campo">
            <label for="Precio">Precio:</label>
            <input type="number" id="precio" step="0.01" min="0">
        </div>
        <div>
            <button id="btnInsertar">Insertar</button>
        </div>

        <h2>Factura</h2>
        <table>
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Precio total</th>
                    <th><button id="btnEliminar">Eliminar</button></th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
            <tfoot>
                <tr><td colspan="3">Subtotal: </td><td id="subtotal">0,00</td><td></td></tr>
                <tr><td colspan="3">Tasa: </td><td id="tasa">20%</td><td></td></tr>
                <tr><td colspan="3">Impuestos: </td><td id="impuestos">0,00</td><td></td></tr>
                <tr class="total"><td colspan="3">TOTAL:</td><td id="total">0,00</td><td></td></tr>
            </tfoot>
        </table>
    </div>

        
<script src="script.js"></script>

</body>
</html>
