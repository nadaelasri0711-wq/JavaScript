<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Eventos
    </h1>
    <h2>Tres formas de crear eventos</h2>
    <ol>
        <li>Evento en línea: <button onclick="console.log('pulsado botón 1')">Botón 1</button></li>
        <li>En la propiedad del elemento: <button id="boton2">Botón 2</button></li>
        <li>Agregando EventListener: <button id="boton3">Botón 3</button></li>
    </ol>
    <script>
        const boton2 = document.getElementById('boton2');

        boton2.onclick = () => console.log('pulsado botón 2');
        /* boton2.onclick = () => console.log('pulsado botón 2 con nueva funcion'); */

        const boton3 = document.getElementById('boton3');
        boton3.addEventListener('click', pulsarBoton);

        function pulsarBoton(){
            console.log('pulsado botón 3');
        }

        boton3.addEventListener('click', () => console.log('nueva funcion en boton 3'));
    </script>

    <h2>El objeto Event</h2>
    <button id="boton4">Botón que lee el evento</button>
    <div id="container" style="background-color: darkorchid;">Pasa el raton por encima</div>
    <p>Al pulsar el boton 4 se muestra por sonsola las propiedades de evento</p>
    <script>
    const boton4 = document.getElementById('boton4');
    const container = document.getElementById('container');


    boton4.addEventListener('click', leerEvento )   
    container.addEventListener('mouseover', leerEvento);

    function leerEvento(event){
        //console.log("propiedades del evento", event);

        console.log(event.type, event.target);
        let elemento = event.target;
        elemento.remove();
    }
    </script>
</body>
</html>
